
name: Build LQ Giftcode Manager APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q LQ_Giftcode_Manager_Android_Source.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p source/LQ_Giftcode_Manager_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LQ-Giftcode-Manager-APK
          path: source/LQ_Giftcode_Manager_Android/app/build/outputs/apk/debug/app-debug.apk
          
